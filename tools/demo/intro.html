<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>ShadowNet</title>
<style>
  :root { --bg: #04070d; --fg: #f1f5f9; --cyan: #22d3ee; --dim: #64748b; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body { display: grid; place-items: center; font-family: "SF Mono", Menlo, Consolas, monospace; color: var(--fg); }
  canvas { position: fixed; inset: 0; }
  .card { position: relative; text-align: center; }
  .title { font-size: 112px; font-weight: 800; letter-spacing: 0.5em; margin-right: -0.5em;
           opacity: 0; animation: rise 1.4s cubic-bezier(.2,.8,.2,1) .3s forwards;
           text-shadow: 0 0 40px rgba(34,211,238,.35); }
  .tag { font-size: 26px; color: #7dd3fc; margin-top: 18px; opacity: 0; animation: fade 1s ease 1.4s forwards; }
  .by { margin-top: 70px; font-size: 22px; color: var(--dim); letter-spacing: .3em; text-transform: uppercase;
        opacity: 0; animation: fade 1s ease 2.4s forwards; }
  .by b { color: var(--fg); font-weight: 600; letter-spacing: .12em; }
  @keyframes rise { from { opacity: 0; transform: translateY(24px); letter-spacing: .8em; } to { opacity: 1; transform: none; } }
  @keyframes fade { to { opacity: 1; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="card">
  <div class="title">SHADOWNET</div>
  <div class="tag">build your own internet &mdash; then break it</div>
  <div class="by">made by <b>Amartya Vikram Singh</b></div>
</div>
<script src="network-bg.js"></script>
</body>
</html>
