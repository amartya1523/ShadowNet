[package]
name = "shadownetd"
description = "ShadowNet simulation daemon: HTTP and WebSocket API, scenarios, benchmarks"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
redis = { version = "1.8.0", features = ["tokio-comp"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shadow-graph.workspace = true
shadow-sim.workspace = true
tokio = { version = "1.54.1", features = ["full"] }
tokio-postgres = "0.7.18"
toml = "1.1.8"
tower-http = { version = "0.7.1", features = ["fs", "cors", "compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
